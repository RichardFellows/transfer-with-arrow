apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-archive-cleanup
  namespace: data-pipeline
spec:
  schedule: "0 1 * * 0"  # Weekly on Sunday at 1 AM
  timeZone: "UTC"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: pipeline-service-account
          containers:
          - name: dlt-runner
            image: your-registry/transfer-with-arrow:latest
            command: ["python", "/app/run_pipeline.py"]
            args: ["archive", "cleanup", "--older-than", "30d"]
            envFrom:
            - secretRef:
                name: database-credentials
            volumeMounts:
            - name: config-volume
              mountPath: /app/config/environments
              readOnly: true
            - name: archive-storage
              mountPath: /data/archive
            - name: manifest-storage
              mountPath: /data/manifests
            - name: logs-storage
              mountPath: /data/logs
            resources:
              requests:
                memory: "1Gi"
                cpu: "500m"
              limits:
                memory: "2Gi"
                cpu: "1000m"
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                - ALL
          volumes:
          - name: config-volume
            configMap:
              name: pipeline-config
          - name: archive-storage
            persistentVolumeClaim:
              claimName: pipeline-archive-pvc
          - name: manifest-storage
            persistentVolumeClaim:
              claimName: pipeline-manifests-pvc
          - name: logs-storage
            emptyDir: {}
          restartPolicy: OnFailure
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1