# Production-scale Reporting_Client pipeline configuration
# Supports incremental loading by SystemCalendarID for daily batch processing

pipeline:
  name: "reporting_client_pipeline"
  dataset_name: "reporting_data"
  backend: "pyarrow"
  chunk_size: 10000        # Optimized for 2M+ records
  loader_file_format: "parquet"
  reflection_level: "minimal"
  backend_kwargs:
    string_storage: "pyarrow"

connections:
  source:
    connection_string: "mssql://sa:SecurePass123@mssql-source:1433/StackOverflowMini"
  destination:
    connection_string: "mssql://sa:SecurePass123@mssql-dest:1434/TargetDB"

tables:
  # Production Reporting_Client table with incremental loading
  Reporting_Client:
    source_table: "dbo.Reporting_Client"
    destination_table: "reporting_client"
    disposition: "append"  # Use append for incremental loading
    incremental:
      enabled: true
      strategy: "sequence"  # Use sequence strategy for integer-based SystemCalendarID
      watermark_column: "SystemCalendarID"
      initial_value: 0  # Will be updated based on last loaded date
    enabled: true
    primary_key: ["RecordID"]
    
  # Full reload version for initial sync testing
  Reporting_Client_Full:
    source_table: "dbo.Reporting_Client"
    destination_table: "reporting_client_full"
    disposition: "replace"  # Full replacement for baseline
    incremental:
      enabled: false
    enabled: false  # Disabled by default, enable for full reload tests

verification:
  enabled: true
  tolerance: 0  # Expect exact match for production data

logging:
  level: "INFO"
  format: "detailed"
  log_dlt_traces: true