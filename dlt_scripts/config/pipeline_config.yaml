# Main Pipeline Configuration
# This file contains the base configuration for the data migration pipeline

pipeline:
  name: "reporting_data_migration"
  dataset_name: "reporting_data"
  chunk_size: 10000
  backend: "pyarrow"
  loader_file_format: "parquet"
  reflection_level: "full_with_precision"
  naming_convention: "direct"  # Options: direct (default), snake_case, duck_case, sql_cs_v1, sql_ci_v1
  backend_kwargs:
    tz: "UTC"

connections:
  source:
    connection_string: "${SOURCE_CONNECTION_STRING}"
    schema: "dbo"
    timeout: 30
  destination:
    connection_string: "${DEST_CONNECTION_STRING}"
    schema: "reporting_data"
    timeout: 30

tables:
  # Production Reporting_Client table with incremental loading  
  Reporting_Client:
    source_table: "dbo.Reporting_Client"
    destination_table: "reporting_client"
    disposition: "append"  # Use append for incremental loading
    incremental:
      enabled: true
      strategy: "sequence"  # Use sequence strategy for integer-based SystemCalendarID
      watermark_column: "SystemCalendarID"
      initial_value: 0  # Will be updated based on last loaded date
    enabled: true
    primary_key: ["RecordID"]
    
  # SCD2 (Slowly Changing Dimension Type 2) table for client dimension data
  Reporting_Client_SCD2:
    source_table: "dbo.Reporting_Client_SCD2"
    destination_table: "reporting_client_scd2"
    disposition: "append"  # Use append for SCD2 incremental loading
    incremental:
      enabled: true
      strategy: "sequence"  # Use sequence strategy for integer-based SystemCalendarID
      watermark_column: "SystemCalendarID"  # Track by SystemCalendarID for daily loads
      initial_value: 0  # Will be updated based on last loaded date
    enabled: true
    primary_key: ["Key"]  # SCD2 surrogate key

verification:
  enabled: true
  tolerance: 0
  # Verify specific tables (if not specified, all enabled tables are verified)
  tables: ["Reporting_Client", "Reporting_Client_SCD2"]
  custom_checks:
    # Custom verification queries for reporting data (using correct schema)
    reporting_client_data_check: "SELECT COUNT(*) FROM reporting_data.reporting_client WHERE SystemCalendarID IS NULL"
    # SCD2 check only runs when both tables are processed
    # scd2_integrity_check: "SELECT COUNT(*) FROM reporting_data.reporting_client_scd2 WHERE IsLatest = 1 GROUP BY ClientBusinessKey HAVING COUNT(*) > 1"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: null  # Set to a file path to enable file logging
  max_file_size: 10485760  # 10MB
  backup_count: 5