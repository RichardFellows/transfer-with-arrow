# Production-scale Reporting_Client pipeline configuration with original column names preserved
# Supports incremental loading by SystemCalendarID for daily batch processing

pipeline:
  name: "reporting_client_pipeline_direct"
  dataset_name: "reporting_data_direct"
  backend: "pyarrow"
  chunk_size: 10000        # Optimized for 2M+ records
  loader_file_format: "parquet"
  reflection_level: "minimal"
  naming_convention: "direct"  # Preserve original column names using DLT's direct naming convention
  backend_kwargs:
    string_storage: "pyarrow"

connections:
  source:
    connection_string: "mssql+pyodbc://sa:SecurePass123@mssql-source:1433/StackOverflowMini?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&Encrypt=no"
  destination:
    connection_string: "mssql+pyodbc://sa:SecurePass123@mssql-dest:1433/TargetDB?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes&Encrypt=no"

tables:
  # Production Reporting_Client table with incremental loading and preserved column names
  Reporting_Client:
    source_table: "dbo.Reporting_Client"
    destination_table: "reporting_client_direct_naming_v2"
    disposition: "append"  # Use append for incremental loading
    incremental:
      enabled: true
      strategy: "sequence"  # Use sequence strategy for integer-based SystemCalendarID
      watermark_column: "SystemCalendarID"  # Original PascalCase name
      initial_value: 0  # Will be updated based on last loaded date
    enabled: true
    primary_key: ["RecordID"]  # Original PascalCase name
    
  # SCD2 (Slowly Changing Dimension Type 2) table for client dimension data
  Reporting_Client_SCD2:
    source_table: "dbo.Reporting_Client_SCD2"
    destination_table: "reporting_client_scd2"
    disposition: "append"  # Use append for SCD2 incremental loading
    incremental:
      enabled: true
      strategy: "sequence"  # Use sequence strategy for integer-based SystemCalendarID
      watermark_column: "SystemCalendarID"  # Track by SystemCalendarID for daily loads
      initial_value: 0  # Will be updated based on last loaded date
    enabled: true
    primary_key: ["Key"]  # SCD2 surrogate key
    
  # Full reload version for initial sync testing
  Reporting_Client_Full:
    source_table: "dbo.Reporting_Client"
    destination_table: "reporting_client_full_preserved"
    disposition: "replace"  # Full replacement for baseline
    incremental:
      enabled: false
    enabled: false  # Disabled by default, enable for full reload tests

verification:
  enabled: true
  tolerance: 0  # Expect exact match for production data

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_dlt_traces: true