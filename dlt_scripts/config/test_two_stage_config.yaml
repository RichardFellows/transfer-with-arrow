# Test configuration for two-stage pipeline
# This config enables parquet archive functionality for testing

pipeline:
  name: "test_two_stage_pipeline"
  dataset_name: "test_reporting_data"
  chunk_size: 1000  # Smaller chunks for testing
  backend: "pyarrow"
  loader_file_format: "parquet"
  reflection_level: "full_with_precision"
  naming_convention: "direct"
  pipeline_mode: "two_stage"  # Enable two-stage mode
  backend_kwargs:
    tz: "UTC"

connections:
  source:
    connection_string: "${SOURCE_CONNECTION_STRING}"
    schema: "dbo"
    timeout: 30
  destination:
    connection_string: "${DEST_CONNECTION_STRING}"
    schema: "test_reporting_data"
    timeout: 30

# Archive configuration for testing
archive:
  enabled: true
  storage_path: "/data/parquet_archive"
  manifest_path: "/data/manifests"
  retention_days: 7  # Shorter retention for testing
  compression: "snappy"
  partitioning:
    enabled: false  # Disable partitioning for simple testing

# Extract configuration
extract:
  batch_naming: "YYYYMMDD_HHMMSS"
  metadata:
    include_source_stats: true
    include_schema_info: true

# Load configuration
load:
  allow_historical: true
  batch_selection: "latest"
  verification_mode: "standard"
  concurrent_batches: 1

# Test with a subset of tables
tables:
  # Smaller test table for initial testing
  Reporting_Client:
    source_table: "dbo.Reporting_Client"
    destination_table: "test_reporting_client"
    disposition: "replace"  # Use replace for testing to start fresh
    incremental:
      enabled: false  # Disable incremental for initial testing
    enabled: true
    primary_key: ["RecordID"]

verification:
  enabled: true
  tolerance: 0
  tables: ["Reporting_Client"]
  custom_checks:
    # Simple check for testing
    test_data_check: "SELECT COUNT(*) FROM test_reporting_data.test_reporting_client WHERE SystemCalendarID IS NULL"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"